    <text x="962" y="244" font-family="Arial, PingFang SC, sans-serif" font-size="12" fill="#AEB8C7">字符集</text>
    <rect x="962" y="254" width="144" height="38" rx="8" fill="#10151D" stroke="#3A485D"/><text x="976" y="279" font-family="Arial, PingFang SC, sans-serif" font-size="14" fill="white">含符号</text>
    <rect x="804" y="306" width="302" height="40" rx="8" fill="#10151D" stroke="#3A485D"/><text x="818" y="332" font-family="monospace" font-size="14" fill="#E7EDF5">pR8!vZ2#qN7@xM4$kL9%tC6&amp;</text>
    <rect x="804" y="355" width="144" height="34" rx="8" fill="#78E3B0"/><text x="834" y="377" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#0B251A">重新生成</text>
    <rect x="962" y="355" width="144" height="34" rx="8" fill="#2B3545"/><text x="1018" y="377" font-family="Arial, PingFang SC, sans-serif" font-size="12" font-weight="700" fill="#F2F5F9">复制</text>
