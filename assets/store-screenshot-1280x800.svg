    <rect x="804" y="450" width="302" height="54" rx="9" fill="#111821"/><text x="818" y="473" font-family="Arial, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="white">示例网站</text><text x="818" y="491" font-family="Arial" font-size="11" fill="#9AA7B8">user@example.com · https://example.com</text><rect x="1037" y="462" width="53" height="28" rx="7" fill="#78E3B0"/><text x="1048" y="481" font-family="Arial, PingFang SC, sans-serif" font-size="11" font-weight="700" fill="#0B251A">填充</text>
