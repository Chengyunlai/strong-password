    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1C2432"/><stop offset="1" stop-color="#0F141D"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1D3148" flood-opacity=".22"/></filter>
